name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Extract files from txt
        run: |
          python3 -c "
          import re, os
          text = open('FamilyGroup_AllFiles (1).txt', encoding='utf-8', errors='ignore').read()
          parts = re.split(r'FILE PATH:\s*', text)
          for part in parts[1:]:
              lines = part.strip().splitlines()
              if not lines: continue
              path = lines[0].strip()
              content = '\n'.join(lines[1:])
              # remove ==== lines
              content = re.sub(r'^=+$', '', content, flags=re.M)
              os.makedirs(os.path.dirname(path) or '.', exist_ok=True)
              open(path, 'w', encoding='utf-8').write(content)
              print('Created', path)
          "

      - name: Get packages
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
